{{ define "health" }}
<div class="space-y-6">
    {{ template "partials/setup_alert" . }}

    <div class="page-header">
        <h1 class="text-2xl sm:text-3xl font-bold text-primary flex items-center gap-3">
            <i class="bi bi-heart-pulse"></i>System Health
        </h1>
        <button id="refresh-health" class="btn btn-outline btn-sm">
            <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
    </div>

    <div id="health-loading" class="text-center py-12">
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <p class="mt-4 text-base-content/70">Checking system health…</p>
    </div>

    <div id="health-content" class="hidden space-y-6">
        <div class="card bg-base-100 shadow-xl">
            <div class="card-body">
                <div class="flex items-center justify-between">
                    <h2 class="card-title">Overall status</h2>
                    <span id="health-overall-badge" class="badge badge-lg">—</span>
                </div>
                <p class="text-sm opacity-70" id="health-last-checked"></p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h3 class="card-title text-lg"><i class="bi bi-cloud text-primary"></i> Debrids</h3>
                    <div id="health-debrids" class="space-y-2"></div>
                </div>
            </div>
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h3 class="card-title text-lg"><i class="bi bi-collection text-secondary"></i> *Arrs</h3>
                    <div id="health-arrs" class="space-y-2"></div>
                </div>
            </div>
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h3 class="card-title text-lg"><i class="bi bi-hdd text-info"></i> Disk</h3>
                    <div id="health-disk" class="space-y-2"></div>
                </div>
            </div>
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h3 class="card-title text-lg"><i class="bi bi-list-check text-warning"></i> Queue</h3>
                    <div id="health-queue"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="health-error" class="alert alert-error hidden">
        <i class="bi bi-exclamation-triangle-fill"></i>
        <span id="health-error-message">Failed to load health</span>
    </div>
</div>

{{ end }}
