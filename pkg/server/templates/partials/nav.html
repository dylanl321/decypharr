{{ define "partials/nav_items" }}
{{ range .Items }}
<li>
    <a href="{{.Href}}"{{if .External}} target="_blank" rel="noopener noreferrer"{{end}}
       class="sidebar-link{{if eq $.ActivePage .Page}} sidebar-link-active{{end}}">
        <i class="bi {{.Icon}} sidebar-icon"></i>
        <span class="sidebar-label">{{.Label}}</span>
        {{if .External}}<i class="bi bi-box-arrow-up-right sidebar-external"></i>{{end}}
    </a>
</li>
{{ end }}
{{ end }}
