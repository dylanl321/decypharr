{{ define "partials/nav_items" }}
{{ range .Items }}
<li>
    <a href="{{.Href}}"{{if .External}} target="_blank" rel="noopener noreferrer"{{end}}
       class="{{if eq $.ActivePage .Page}}menu-active{{end}}{{if $.Compact}} gap-2{{end}}">
        <i class="bi {{.Icon}}{{if $.Compact}} text-primary{{end}}"></i>
        {{if not $.IconOnly}}<span{{if $.Compact}}{{else}} class="hidden xl:inline"{{end}}>{{.Label}}</span>{{end}}
    </a>
</li>
{{ end }}
{{ end }}
